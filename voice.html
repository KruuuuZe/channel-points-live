<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Channel Points · Voice</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:"Segoe UI",system-ui,Roboto,sans-serif;color:#f5f2ff;background:#05040a}
h1{margin:0;font-size:22px;letter-spacing:.06em}
p{color:#a59cc4;max-width:520px;text-align:center;line-height:1.45;margin:0}
button{font:inherit;font-weight:800;font-size:18px;color:#0b0a12;background:#a3e635;border:0;border-radius:14px;padding:14px 22px}
select{font:inherit;color:#f5f2ff;background:#1a1530;border:1px solid #2a2342;border-radius:10px;padding:8px 10px;max-width:520px}
#meter{width:420px;max-width:90vw;height:22px;border-radius:12px;background:#1a1530;overflow:hidden;border:1px solid #2a2342}
#bar{height:100%;width:0;background:linear-gradient(90deg,#a3e635,#a855f7);transition:width .05s}
#st{font-weight:700}
.ok{color:#a3e635}.bad{color:#ff8fc8}
</style>
</head>
<body>
<h1>🎙 Voice for the smoke face</h1>
<p>Keep this page open in a browser on the PC while the face is on. It listens to your mic and sends only how loud you are and the shape of the sound to your overlay (no audio is sent anywhere).</p>
<select id="mic"><option value="">Default microphone</option></select>
<button id="go">Start</button>
<div id="meter"><div id="bar"></div></div>
<div id="st">Not started</div>
<script>
/* ================= KZRelay: instant messages between the app and the overlays =================
   A tiny MQTT client over WebSockets. It connects to two free public MQTT servers at once and sends every
   message through both, so if one is slow or down the other still delivers; duplicates are dropped.
   Connections stay open (with a ping every 25 s) and reconnect within a few seconds if they drop. */
window.KZRelay = function (topic, onMessage, servers) {
  const SERVERS = servers || ["wss://broker.hivemq.com:8884/mqtt", "wss://broker.emqx.io:8084/mqtt"];
  const enc = new TextEncoder(), dec = new TextDecoder();
  const str = s => { const b = enc.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
  const packet = (type, body) => {
    const len = []; let n = body.length;
    do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; len.push(d); } while (n > 0);
    return new Uint8Array([type, ...len, ...body]);
  };
  const seen = new Set(), seenList = [];
  const fresh = id => { if (!id || seen.has(id)) return false; seen.add(id); seenList.push(id); if (seenList.length > 500) seen.delete(seenList.shift()); return true; };
  const conns = [], waiting = [];
  let up = 0;
  const openCount = () => conns.filter(c => c.ready).length;
  function connect(url) {
    const c = { url, ready: false, ws: null, back: 1000, ping: 0, buf: new Uint8Array(0) };
    conns.push(c);
    const start = () => {
      let ws; try { ws = new WebSocket(url, "mqtt"); } catch (e) { return setTimeout(start, c.back); }
      c.ws = ws; ws.binaryType = "arraybuffer";
      ws.onopen = () => {
        const id = "kz" + Math.random().toString(36).slice(2, 12);
        ws.send(packet(0x10, [...str("MQTT"), 4, 0x02, 0, 60, ...str(id)]));          // CONNECT, clean session, keepalive 60 s
      };
      ws.onmessage = e => {
        let b = new Uint8Array(e.data);
        if (c.buf.length) { const j = new Uint8Array(c.buf.length + b.length); j.set(c.buf); j.set(b, c.buf.length); b = j; c.buf = new Uint8Array(0); }
        let i = 0;
        while (i < b.length) {
          const type = b[i] >> 4; let mult = 1, len = 0, k = i + 1, d;
          do { if (k >= b.length) { c.buf = b.slice(i); return; } d = b[k++]; len += (d & 127) * mult; mult *= 128; } while (d & 128);
          if (k + len > b.length) { c.buf = b.slice(i); return; }
          const body = b.subarray(k, k + len);
          if (type === 2) {                                                               // CONNACK: subscribe
            ws.send(packet(0x82, [0, 1, ...str(topic), 0]));
          } else if (type === 9) {                                                        // SUBACK: ready
            c.ready = true; c.back = 1000; up++;
            while (waiting.length) { const p = waiting.shift(); conns.forEach(x => x.ready && x.ws.send(p)); }
            clearInterval(c.ping); c.ping = setInterval(() => { try { ws.send(new Uint8Array([0xC0, 0])); } catch (x) {} }, 25000);
            if (typeof api.onUp === "function") api.onUp(openCount());
          } else if (type === 3) {                                                        // PUBLISH
            const tl = (body[0] << 8) | body[1], qos = (b[i] >> 1) & 3;
            const msg = dec.decode(body.subarray(2 + tl + (qos ? 2 : 0)));
            let o; try { o = JSON.parse(msg); } catch (x) { o = null; }
            if (o && fresh(o._id)) { try { onMessage(o); } catch (x) { console.error(x); } }
          }
          i = k + len;
        }
      };
      ws.onclose = ws.onerror = () => {
        if (c.ws !== ws) return; c.ws = null;
        if (c.ready) { c.ready = false; up--; } clearInterval(c.ping);
        setTimeout(start, c.back); c.back = Math.min(8000, c.back * 2);                    // back within 1-8 seconds
        if (typeof api.onDown === "function") api.onDown(openCount());
      };
    };
    start();
  }
  const api = {
    send(o) {
      o = Object.assign({ _id: Math.random().toString(36).slice(2) + Date.now().toString(36) }, o);
      fresh(o._id);                                                                      // don't hear our own message back
      const p = packet(0x30, [...str(topic), ...enc.encode(JSON.stringify(o))]);
      const live = conns.filter(c => c.ready);
      if (live.length) live.forEach(c => { try { c.ws.send(p); } catch (x) {} });
      else { waiting.push(p); setTimeout(() => { const i = waiting.indexOf(p); if (i >= 0) waiting.splice(i, 1); }, 15000); }
      return o._id;
    },
    connected: () => openCount(),
    onUp: null, onDown: null
  };
  SERVERS.forEach(connect);
  return api;
};

const $ = s => document.querySelector(s), key = new URLSearchParams(location.search).get("ctl");
if (!key) { $("#st").innerHTML = '<span class="bad">This link is missing your pairing key. Copy the Voice link from the app\'s Control screen.</span>'; $("#go").disabled = true; }
const relay = key ? KZRelay("kzctl/" + key, () => {}) : null;
navigator.mediaDevices && navigator.mediaDevices.enumerateDevices().then(ds => ds.filter(d => d.kind === "audioinput").forEach(d => { const o = document.createElement("option"); o.value = d.deviceId; o.textContent = d.label || "Microphone"; $("#mic").append(o); })).catch(() => {});
$("#go").onclick = async () => {
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: $("#mic").value || undefined, echoCancellation: false, noiseSuppression: false } });
    const c = new (window.AudioContext || window.webkitAudioContext)(), an = c.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = .4;
    c.createMediaStreamSource(st).connect(an);
    const buf = new Float32Array(an.fftSize), fb = new Uint8Array(an.frequencyBinCount), hz = c.sampleRate / 2 / fb.length;
    let level = 0, shape = .5, sent = 0, lastL = -1;
    $("#go").textContent = "Listening…"; $("#go").disabled = true;
    setInterval(() => {
      an.getFloatTimeDomainData(buf); let sum = 0; for (const v of buf) sum += v * v;
      const lv = Math.max(0, Math.min(1, (Math.sqrt(sum / buf.length) - .012) * 9));
      an.getByteFrequencyData(fb); let w = 0, tot = 0; for (let i = 2; i < fb.length; i++) { const f = i * hz; if (f > 4000) break; w += f * fb[i]; tot += fb[i]; }
      const sh = tot ? Math.max(0, Math.min(1, (w / tot - 700) / 1600)) : .5;
      level += (lv - level) * (lv > level ? .55 : .22); shape += (sh - shape) * .2;
      $("#bar").style.width = (level * 100) + "%";
      const now = Date.now(), q = Math.round(level * 20) / 20;
      // about 12 times a second while you talk; once a second when quiet
      if ((q !== lastL || now - sent > 1000) && now - sent > 80 && relay) { relay.send({ from: "app", to: "html3", cmd: "voice", noack: true, t: now, l: +level.toFixed(2), s: +shape.toFixed(2) }); sent = now; lastL = q; }
      const n = relay ? relay.connected() : 0;
      $("#st").innerHTML = n ? '<span class="ok">● Sending to your overlay</span>' : '<span class="bad">○ Connecting…</span>';
    }, 40);
  } catch (e) { $("#st").innerHTML = '<span class="bad">Couldn\'t use the mic: ' + e.message + '</span>'; }
};
</script>
</body>
</html>
