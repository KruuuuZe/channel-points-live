/* ================= live Twitch ================= */
const NEED = { "moderator:read:followers": "followers", "channel:read:subscriptions": "subs", "bits:read": "bits" };
const chatColors = {};        // name colors seen in chat, by user id
async function colorOf(userId) {
  if (!userId) return TWITCH_DEFAULTS[11];
  if (chatColors[userId]) return chatColors[userId];
  try {
    const r = await Live.helix("chat/color?user_id=" + encodeURIComponent(userId));
    const c = (await r.json()).data?.[0]?.color;
    if (c) return (chatColors[userId] = c);
  } catch (e) {}
  return TWITCH_DEFAULTS[parseInt(userId, 10) % TWITCH_DEFAULTS.length] || "#a3e635";
}
const Live = {
  cid: null, uid: null, login: null, ws: null, seen: [], watchdog: null, keepalive: 10, backoff: 2000, closing: new Set(),
  async init() {
    try {
      const r = await fetch("https://id.twitch.tv/oauth2/validate", { headers: { Authorization: "OAuth " + TOKEN } });
      if (r.status === 401) return toast("Twitch token expired or invalid. Get a new one in the Connect tab of overlay.html.", true, 600000);
      const v = await r.json();
      this.cid = v.client_id; this.uid = v.user_id; this.login = v.login;
      const missing = Object.keys(NEED).filter(s => !(v.scopes || []).includes(s));
      if (missing.length) toast("Token can't read " + missing.map(s => NEED[s]).join(", ") + ". Get a new token in the Connect tab of overlay.html.", true, 600000);
      this.connect("wss://eventsub.wss.twitch.tv/ws", false);
      Chat.connect(this.login);
      setInterval(() => this.revalidate(), 3600 * 1000);
    } catch (e) { toast("Can't reach Twitch. Retrying in 15s…", true, 14000); setTimeout(() => this.init(), 15000); }
  },
  async revalidate() {
    try { const r = await fetch("https://id.twitch.tv/oauth2/validate", { headers: { Authorization: "OAuth " + TOKEN } });
      if (r.status === 401) toast("Twitch token expired. Get a new one in the Connect tab of overlay.html.", true, 600000); } catch (e) {}
  },
  helix(path, opts = {}) {
    return fetch("https://api.twitch.tv/helix/" + path, { ...opts,
      headers: { Authorization: "Bearer " + TOKEN, "Client-Id": this.cid, "Content-Type": "application/json" } });
  },
  connect(url, isReconnect) {
    const ws = new WebSocket(url);
    ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch (x) { return; }
      const type = m.metadata?.message_type, id = m.metadata?.message_id;
      if (id) { if (this.seen.includes(id)) return; this.seen.push(id); if (this.seen.length > 300) this.seen.shift(); }
      this.kick();
      if (type === "session_welcome") {
        const old = this.ws; this.ws = ws; this.backoff = 2000;
        this.keepalive = m.payload.session.keepalive_timeout_seconds || 10; this.kick();
        if (isReconnect && old && old !== ws) { this.closing.add(old); old.close(); }
        else this.subscribe(m.payload.session.id);
      } else if (type === "session_reconnect") this.connect(m.payload.session.reconnect_url, true);
      else if (type === "notification") this.handle(m.metadata.subscription_type, m.payload.event);
      else if (type === "revocation") toast("Twitch stopped sending " + (m.payload?.subscription?.type || "events") + ". Get a new token.", true, 600000);
    };
    ws.onclose = () => {
      if (this.closing.has(ws)) { this.closing.delete(ws); return; }
      if (ws !== this.ws && this.ws) return;
      this.ws = null; clearTimeout(this.watchdog);
      setTimeout(() => this.connect("wss://eventsub.wss.twitch.tv/ws", false), this.backoff);
      this.backoff = Math.min(60000, this.backoff * 2);
    };
    if (!isReconnect && !this.ws) this.ws = ws;
  },
  kick() { clearTimeout(this.watchdog); this.watchdog = setTimeout(() => { if (this.ws) this.ws.close(); }, (this.keepalive + 10) * 1000); },
  async subscribe(sessionId) {
    const b = { broadcaster_user_id: this.uid };
    const subs = [
      ["channel.follow", "2", { broadcaster_user_id: this.uid, moderator_user_id: this.uid }],
      ["channel.subscribe", "1", b], ["channel.subscription.message", "1", b], ["channel.subscription.gift", "1", b],
      ["channel.cheer", "1", b], ["channel.raid", "1", { to_broadcaster_user_id: this.uid }]
    ];
    const failed = []; let why = "";
    for (const [type, version, condition] of subs) {
      try {
        const r = await this.helix("eventsub/subscriptions", { method: "POST",
          body: JSON.stringify({ type, version, condition, transport: { method: "websocket", session_id: sessionId } }) });
        if (!r.ok && r.status !== 409) { failed.push(type.replace("channel.", "")); if (!why) try { why = (await r.json()).message || ""; } catch (x) {} }
      } catch (e) { failed.push(type.replace("channel.", "")); }
    }
    if (!failed.length) toast("⚡ Alerts connected to Twitch", false, 4000);
    else toast("Couldn't listen for: " + failed.join(", ") + (why ? " (Twitch says: " + why + ")" : "") +
      ". Your token is missing permissions. Open overlay.html, go to the Connect tab, log in again and approve every permission, then put the new token in this browser source's link.", true, 600000);
  },
  async handle(type, ev) {
    const who = (n, l, anon) => anon ? "Anonymous" : (n || l || "someone");
    if (type === "channel.follow") Alerts.follow(who(ev.user_name, ev.user_login), await colorOf(ev.user_id));
    // new subs and resubs get the plane; gifted subs are skipped so a big gift drop doesn't launch 50 planes
    else if (type === "channel.subscribe") {
      if (!ev.is_gift) Alerts.sub(who(ev.user_name, ev.user_login), await colorOf(ev.user_id));
      else Gifts.recipient(who(ev.user_name, ev.user_login));       // someone received a gifted sub
    }
    else if (type === "channel.subscription.gift")
      Gifts.gift(who(ev.user_name, ev.user_login, ev.is_anonymous), ev.total || 1, ev.is_anonymous ? "#f472b6" : await colorOf(ev.user_id));
    else if (type === "channel.subscription.message") Alerts.sub(who(ev.user_name, ev.user_login), await colorOf(ev.user_id));
    else if (type === "channel.cheer") Alerts.bits(who(ev.user_name, ev.user_login, ev.is_anonymous), ev.bits || 0, ev.is_anonymous ? null : await colorOf(ev.user_id));
    else if (type === "channel.raid") Alerts.raid(who(ev.from_broadcaster_user_name, ev.from_broadcaster_user_login));
  }
};
/* watch streaks (and everyone's name colors) come from chat, read anonymously */
const Chat = {
  ws: null, chan: null, backoff: 2000,
  connect(login) {
    this.chan = login.toLowerCase();
    const ws = this.ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
    ws.onopen = () => {
      ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
      ws.send("PASS SCHMOOPIIE");
      ws.send("NICK justinfan" + Math.floor(10000 + Math.random() * 80000));
      ws.send("JOIN #" + this.chan);
      this.backoff = 2000;
    };
    ws.onmessage = e => e.data.split("\r\n").forEach(line => this.line(line));
    ws.onclose = () => { setTimeout(() => this.connect(this.chan), this.backoff); this.backoff = Math.min(60000, this.backoff * 2); };
  },
  line(line) {
    if (!line) return;
    if (line.startsWith("PING")) { this.ws.send("PONG" + line.slice(4)); return; }
    if (!line.startsWith("@")) return;
    const tags = {};
    line.slice(1, line.indexOf(" ")).split(";").forEach(kv => { const i = kv.indexOf("="); tags[kv.slice(0, i)] = kv.slice(i + 1).replace(/\\s/g, " "); });
    if (tags["user-id"] && tags.color) chatColors[tags["user-id"]] = tags.color;
    const pm = line.indexOf(" PRIVMSG ");
    if (pm > 0) {
      const login = (line.match(/ :([^!]+)!/) || [])[1] || "";
      const msg = line.slice(line.indexOf(" :", pm) + 2).trim();
      AutoFx.chat(login);
      if (/^!lurk\b/i.test(msg)) Lurk.join(tags["display-name"] || login, login, tags.color || chatColors[tags["user-id"]]);
      else if (/^!(star[1-6]|staroff)\b/i.test(msg)) {         // wanted stars: the streamer only (counts as chat, so a lurking streamer leaves the tower)
        if ((tags.badges || "").includes("broadcaster/")) { const m = msg.match(/^!star([1-6])/i); Wanted.set(m ? +m[1] : 0); }
        Lurk.leave(login);
      }
      else if (/^!scroopleaderboard\b/i.test(msg)) Scrap.showBoard();
      else if (/^!scroop\b/i.test(msg) || msg.includes("kruuuuCatch1")) Scrap.dig(tags["display-name"] || login, login, tags.color || chatColors[tags["user-id"]]);   // lurkers can scroop without leaving the tower
      else Lurk.leave(login);
      return;
    }
    if (line.indexOf(" USERNOTICE ") > 0 && tags["msg-id"] === "viewermilestone" && tags["msg-param-category"] === "watch-streak")
      Alerts.streak(tags["display-name"] || tags.login || "viewer", +tags["msg-param-value"] || 1, tags.login, tags.color || chatColors[tags["user-id"]]);
  }
};


/* ================= lurk tower =================
   !lurk in chat: the tower rises (bottom-left), a stick figure climbs the ladder, the light goes on,
   they walk to a seat and sit, the light goes off and a screen glow stays. 10s later the tower sinks.
   Lurkers stay inside (saved) until they type something else in chat. */
const Lurk = {
  KEY: "cpo3_lurkers",
  list: [], figs: {}, q: [], busy: false, up: false, lowerT: null, arriving: new Set(),
  init() {
    try { this.list = JSON.parse(localStorage.getItem(this.KEY)) || []; } catch (e) { this.list = []; }
    const day = Date.now() - 12 * 3600 * 1000;           // forget lurkers from an old stream
    this.list = this.list.filter(x => x.t > day); this.save();
  },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.list)); } catch (e) {} this.sign(); },
  sign() { const n = this.list.length; $("#towerSign").textContent = n ? `LURKERS · ${n}` : "LURKERS"; },
  join(name, login, color) {
    const k = (login || name).toLowerCase();
    const have = this.list.find(x => x.k === k);
    MySounds.play("lurk");
    if (have) { have.t = Date.now(); this.save(); this.raise().then(() => this.lowerLater()); return; }
    this.list.push({ k, name, color: color || TWITCH_DEFAULTS[k.length % TWITCH_DEFAULTS.length], t: Date.now() });
    this.save();
    this.arriving.add(k);
    this.q.push(k); if (!this.busy) this.next();
  },
  leave(login) {
    const k = (login || "").toLowerCase();
    const i = this.list.findIndex(x => x.k === k);
    if (i < 0) return;
    MySounds.play("chat");
    this.list.splice(i, 1); this.save();
    this.q = this.q.filter(x => x !== k); this.arriving.delete(k);
    const f = this.figs[k];
    if (f) { delete this.figs[k]; f.animate([{ opacity: 1 }, { opacity: 0, transform: "translateY(30px)" }], { duration: 600, fill: "forwards" });
      setTimeout(() => { f.remove(); if (f._lbl) f._lbl.remove(); }, 650); }
    this.layout();
  },
  seatX(k) {   // seats spread across the window, in the order people arrived
    const seated = this.list.filter(x => !this.arriving.has(x.k) || this.figs[x.k]);
    const i = seated.findIndex(x => x.k === k), n = seated.length;
    if (n <= 1) return 190;
    return 34 + i * (300 / (n - 1));
  },
  layout() {
    this.list.forEach((x, idx) => {
      const f = this.figs[x.k];
      if (!f || !f.classList.contains("seat")) return;
      f.style.left = this.seatX(x.k) + "px";
      f.classList.toggle("hi", idx % 2 === 1);
    });
  },
  makeFig(entry, cls) {
    const f = el("div", "fig " + cls);
    f.style.setProperty("--fc", css(bright(entry.color)));
    f.innerHTML = `<svg viewBox="0 0 60 120"><g class="chair"><line x1="10" y1="74" x2="44" y2="74"/><line x1="14" y1="74" x2="14" y2="96"/><line x1="40" y1="74" x2="40" y2="96"/><line x1="10" y1="74" x2="10" y2="44"/></g><line class="aL" x1="30" y1="36" x2="30" y2="64"/><line class="aR" x1="30" y1="36" x2="30" y2="64"/>
      <g class="tL"><line x1="30" y1="70" x2="30" y2="95"/><g class="sh"><line x1="30" y1="95" x2="30" y2="118"/></g></g>
      <g class="tR"><line x1="30" y1="70" x2="30" y2="95"/><g class="sh"><line x1="30" y1="95" x2="30" y2="118"/></g></g>
      <line x1="30" y1="26" x2="30" y2="70"/><circle cx="30" cy="14" r="11"/></svg>`;
    const l = el("div", "lbl", entry.name);
    if (cls.includes("climb")) f.append(l);
    else { l.style.setProperty("--fc", css(bright(entry.color))); $("#tower .t-lbl").append(l); f._lbl = l; this.sync(); }
    return f;
  },
  sync() {         // keep each name floating above its stick figure
    if (this._raf) return;
    const step = () => {
      let any = false;
      document.querySelectorAll("#tower .t-in .fig").forEach(f => {
        if (!f._lbl) return; any = true;
        const sit = f.classList.contains("sit") ? 24 : 0, hi = f.classList.contains("hi") ? 34 : 0;
        f._lbl.style.left = (f.offsetLeft + 30) + "px";
        f._lbl.style.top = (f.offsetTop + sit - 8 - hi) + "px";
        f._lbl.style.opacity = getComputedStyle(f).opacity;
      });
      this._raf = any || this.up ? requestAnimationFrame(step) : 0;
    };
    this._raf = requestAnimationFrame(step);
  },
  raise() {
    if (this.up) return Promise.resolve();
    // everyone already lurking is inside, seated, with the screen glow on
    $("#tower .t-in").innerHTML = ""; $("#tower .t-lbl").innerHTML = ""; this.figs = {};
    this.list.forEach((x, idx) => {
      if (this.arriving.has(x.k)) return;
      const f = this.makeFig(x, "seat sit" + (idx % 2 ? " hi" : ""));
      f.style.left = this.seatX(x.k) + "px"; f.style.top = "115px";
      $("#tower .t-in").append(f); this.figs[x.k] = f;
    });
    $("#tower .t-int").classList.remove("lit");
    $("#tower .t-glow").classList.toggle("on", Object.keys(this.figs).length > 0);
    this.up = true; $("#tower").classList.add("up"); this.sync();
    return new Promise(r => setTimeout(r, 1200));
  },
  lowerLater() { clearTimeout(this.lowerT); this.lowerT = setTimeout(() => { if (!this.busy) { this.up = false; $("#tower").classList.remove("up"); } }, 10000); },
  async next() {
    const k = this.q.shift();
    if (!k) { this.busy = false; this.lowerLater(); return; }
    this.busy = true; clearTimeout(this.lowerT);
    const entry = this.list.find(x => x.k === k);
    if (!entry) { this.next(); return; }
    try { await this.arrive(entry); } catch (e) { console.error(e); }
    this.next();
  },
  wait(ms) { return new Promise(r => setTimeout(r, ms)); },
  async arrive(entry) {
    await this.raise();
    // 1) climb the ladder (outside, in front of the tower)
    const c = this.makeFig(entry, "climb");
    c.style.left = "250px"; c.style.top = "700px";
    $("#tower .t-out").append(c);
    await c.animate([{ top: "700px" }, { top: "440px" }], { duration: 3200, easing: "linear", fill: "forwards" }).finished;
    // 2) through the hatch: the light comes on
    await c.animate([{ opacity: 1 }, { opacity: 0, transform: "translateY(-24px)" }], { duration: 350, fill: "forwards" }).finished;
    c.remove();
    if (!this.list.find(x => x.k === entry.k)) return;          // typed in chat while climbing
    $("#tower .t-glow").classList.remove("on");
    $("#tower .t-int").classList.add("lit");
    const f = this.makeFig(entry, "walk");
    f.style.left = "190px"; f.style.top = "250px";
    $("#tower .t-in").append(f); this.figs[entry.k] = f;
    this.arriving.delete(entry.k);
    await f.animate([{ top: "250px" }, { top: "115px" }], { duration: 650, easing: "ease-out", fill: "forwards" }).finished;
    f.style.top = "115px";
    this.layout();                                              // others shuffle over to make room
    // 3) walk around a bit, then to the seat
    const seat = this.seatX(entry.k);
    const wander = Math.max(34, Math.min(334, seat + (seat > 190 ? -120 : 120)));
    for (const x of [wander, seat]) {
      const from = parseFloat(f.style.left);
      f.classList.toggle("left", x < from);
      const dur = Math.max(300, Math.abs(x - from) * 9);
      await f.animate([{ left: from + "px" }, { left: x + "px" }], { duration: dur, easing: "linear", fill: "forwards" }).finished;
      f.style.left = x + "px";
      await this.wait(250);
    }
    f.getAnimations().forEach(a => a.cancel());
    f.style.left = seat + "px";
    f.classList.remove("walk", "left"); f.classList.add("seat", "sit");
    this.layout();
    await this.wait(900);
    // 4) lights off, screen glow on
    $("#tower .t-int").classList.remove("lit");
    $("#tower .t-glow").classList.add("on");
    await this.wait(400);
  }
};
Lurk.init();

if (LIVE) Live.init();

<script>
/* ================= remote control from the Channel Points app =================
   Only runs when the OBS link has &ctl=KEY (the pairing key shown in the app's Control screen).
   The app and this page talk instantly through KZRelay (two public MQTT servers at once) on a channel named
   after that key. Every command is answered with "ack", so the app knows it arrived. This page also says
   "hello" (its name and version) when it connects and whenever the app asks. */
/* ================= KZRelay: instant messages between the app and the overlays =================
   A tiny MQTT client over WebSockets. It connects to two free public MQTT servers at once and sends every
   message through both, so if one is slow or down the other still delivers; duplicates are dropped.
   Connections stay open (with a ping every 25 s) and reconnect within a few seconds if they drop. */
window.KZRelay = function (topic, onMessage, servers) {
  const SERVERS = servers || ["wss://broker.hivemq.com:8884/mqtt", "wss://broker.emqx.io:8084/mqtt"];
  const enc = new TextEncoder(), dec = new TextDecoder();
  const str = s => { const b = enc.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
  const packet = (type, body) => {
    const len = []; let n = body.length;
    do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; len.push(d); } while (n > 0);
    return new Uint8Array([type, ...len, ...body]);
  };
  const seen = new Set(), seenList = [];
  const fresh = id => { if (!id || seen.has(id)) return false; seen.add(id); seenList.push(id); if (seenList.length > 500) seen.delete(seenList.shift()); return true; };
  const conns = [], waiting = [];
  let up = 0;
  const openCount = () => conns.filter(c => c.ready).length;
  function connect(url) {
    const c = { url, ready: false, ws: null, back: 1000, ping: 0, buf: new Uint8Array(0) };
    conns.push(c);
    const start = () => {
      let ws; try { ws = new WebSocket(url, "mqtt"); } catch (e) { return setTimeout(start, c.back); }
      c.ws = ws; ws.binaryType = "arraybuffer";
      ws.onopen = () => {
        const id = "kz" + Math.random().toString(36).slice(2, 12);
        ws.send(packet(0x10, [...str("MQTT"), 4, 0x02, 0, 60, ...str(id)]));          // CONNECT, clean session, keepalive 60 s
      };
      ws.onmessage = e => {
        let b = new Uint8Array(e.data);
        if (c.buf.length) { const j = new Uint8Array(c.buf.length + b.length); j.set(c.buf); j.set(b, c.buf.length); b = j; c.buf = new Uint8Array(0); }
        let i = 0;
        while (i < b.length) {
          const type = b[i] >> 4; let mult = 1, len = 0, k = i + 1, d;
          do { if (k >= b.length) { c.buf = b.slice(i); return; } d = b[k++]; len += (d & 127) * mult; mult *= 128; } while (d & 128);
          if (k + len > b.length) { c.buf = b.slice(i); return; }
          const body = b.subarray(k, k + len);
          if (type === 2) {                                                               // CONNACK: subscribe
            ws.send(packet(0x82, [0, 1, ...str(topic), 0]));
          } else if (type === 9) {                                                        // SUBACK: ready
            c.ready = true; c.back = 1000; up++;
            while (waiting.length) { const p = waiting.shift(); conns.forEach(x => x.ready && x.ws.send(p)); }
            clearInterval(c.ping); c.ping = setInterval(() => { try { ws.send(new Uint8Array([0xC0, 0])); } catch (x) {} }, 25000);
            if (typeof api.onUp === "function") api.onUp(openCount());
          } else if (type === 3) {                                                        // PUBLISH
            const tl = (body[0] << 8) | body[1], qos = (b[i] >> 1) & 3;
            const msg = dec.decode(body.subarray(2 + tl + (qos ? 2 : 0)));
            let o; try { o = JSON.parse(msg); } catch (x) { o = null; }
            if (o && fresh(o._id)) { try { onMessage(o); } catch (x) { console.error(x); } }
          }
          i = k + len;
        }
      };
      ws.onclose = ws.onerror = () => {
        if (c.ws !== ws) return; c.ws = null;
        if (c.ready) { c.ready = false; up--; } clearInterval(c.ping);
        setTimeout(start, c.back); c.back = Math.min(8000, c.back * 2);                    // back within 1-8 seconds
        if (typeof api.onDown === "function") api.onDown(openCount());
      };
    };
    start();
  }
  const api = {
    send(o) {
      o = Object.assign({ _id: Math.random().toString(36).slice(2) + Date.now().toString(36) }, o);
      fresh(o._id);                                                                      // don't hear our own message back
      const p = packet(0x30, [...str(topic), ...enc.encode(JSON.stringify(o))]);
      const live = conns.filter(c => c.ready);
      if (live.length) live.forEach(c => { try { c.ws.send(p); } catch (x) {} });
      else { waiting.push(p); setTimeout(() => { const i = waiting.indexOf(p); if (i >= 0) waiting.splice(i, 1); }, 15000); }
      return o._id;
    },
    connected: () => openCount(),
    onUp: null, onDown: null
  };
  SERVERS.forEach(connect);
  return api;
};

(() => {
  const qs = new URLSearchParams(location.search), key = qs.get("ctl");
  if (!key || !window.WebSocket) return;
  const PAGE = "html3", VERSION = "d7b9bd8";
  let said = false;
  const relay = KZRelay("kzctl/" + key, c => {
    if (!c || c.from === "overlay" || (c.to && c.to !== "all" && c.to !== PAGE)) return;
    if (c.t && Date.now() - c.t > 60000) return;                     // ignore anything stale
    const ack = () => relay.send({ from: "overlay", page: PAGE, version: VERSION, cmd: "ack", ack: c._id });
    if (c.cmd === "ping") relay.send({ from: "overlay", page: PAGE, version: VERSION, cmd: "hello" });
    else if (c.cmd === "reload") {                                  // load the newest version (a fresh address skips any cached copy)
      ack(); setTimeout(() => { const u = new URL(location.href); u.searchParams.set("_v", Date.now()); location.replace(u.toString()); }, 300);
    } else if (typeof window.onRemote === "function") { try { window.onRemote(c); ack(); } catch (x) { console.error(x); } }
  });
  // lets the page answer the app itself (e.g. "the art arrived and is saved")
  window.remoteSend = o => relay.send(Object.assign({ from: "overlay", page: PAGE, version: VERSION }, o));
  relay.onUp = () => { if (!said) { said = true; relay.send({ from: "overlay", page: PAGE, version: VERSION, cmd: "hello" }); } };
})();
